name: scoold-network

topology:
  nodes:
    client1:
      kind: linux
      image: ghcr.io/hellt/network-multitool:latest
      exec:
        - ip addr add 10.0.1.10/24 dev eth1
        - ip route replace default via 10.0.1.1 dev eth1
        - sh -c 'printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" > /etc/resolv.conf'

    router1:
      kind: linux
      image: ghcr.io/hellt/network-multitool:latest
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr add 10.0.1.1/24 dev eth1
        - ip addr add 10.0.12.1/30 dev eth2
        - ip addr add 10.0.100.2/30 dev eth3
        - ip route add 10.0.2.0/24 via 10.0.12.2 dev eth2
        - ip route replace default via 10.0.100.1 dev eth3

    router2:
      kind: linux
      image: ghcr.io/hellt/network-multitool:latest
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr add 10.0.12.2/30 dev eth1
        - ip addr add 10.0.2.1/24 dev eth2
        - ip route add 10.0.1.0/24 via 10.0.12.1 dev eth1
        - ip route replace default via 10.0.12.1 dev eth1

    client2:
      kind: linux
      image: ghcr.io/hellt/network-multitool:latest
      exec:
        - ip addr add 10.0.2.10/24 dev eth1
        - ip route replace default via 10.0.2.1 dev eth1
        - sh -c 'printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" > /etc/resolv.conf'

    isp:
      kind: linux
      image: ghcr.io/hellt/network-multitool:latest
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr add 10.0.100.1/30 dev eth1
        - ip route add 10.0.0.0/8 via 10.0.100.2 dev eth1
        - iptables -t nat -A POSTROUTING -s 10.0.0.0/8 -o eth0 -j MASQUERADE
        - iptables -A FORWARD -s 10.0.0.0/8 -o eth0 -j ACCEPT
        - iptables -A FORWARD -d 10.0.0.0/8 -i eth0 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT

  links:
    - endpoints: ["client1:eth1", "router1:eth1"]
    - endpoints: ["router1:eth2", "router2:eth1"]
    - endpoints: ["router2:eth2", "client2:eth1"]
    - endpoints: ["router1:eth3", "isp:eth1"]
