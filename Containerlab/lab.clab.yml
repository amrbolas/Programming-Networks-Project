name: scoold-network

topology:
  nodes:
    client1:
      kind: linux
      image: ghcr.io/hellt/network-multitool:latest
      exec:
        - ip addr add 10.0.1.10/24 dev eth1
        - ip route replace default via 10.0.1.1 dev eth1
        - sh -c 'printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" > /etc/resolv.conf'

    router1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/router1/daemons:/etc/frr/daemons
        - configs/router1/frr.conf:/etc/frr/frr.conf
        - configs/router1/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip route del default via 172.20.20.1 dev eth0

    router2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/router2/daemons:/etc/frr/daemons
        - configs/router2/frr.conf:/etc/frr/frr.conf
        - configs/router2/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip route del default via 172.20.20.1 dev eth0

    client2:
      kind: linux
      image: ghcr.io/hellt/network-multitool:latest
      exec:
        - ip addr add 10.0.2.10/24 dev eth1
        - ip route replace default via 10.0.2.1 dev eth1
        - sh -c 'printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" > /etc/resolv.conf'

    isp:
      kind: linux
      image: ghcr.io/hellt/network-multitool:latest
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr add 10.0.100.1/30 dev eth1
        - ip addr add 10.0.200.1/30 dev eth2
        - ip route add 10.0.0.0/8 via 10.0.100.2 dev eth1
        - ip route replace default via 10.0.200.2 dev eth2

    firewall:
      kind: linux
      image: ghcr.io/hellt/network-multitool:latest
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr add 10.0.200.2/30 dev eth1
        - ip route add 10.0.0.0/8 via 10.0.200.1 dev eth1

        # تنظيف أي قواعد سابقة
        - iptables -F
        - iptables -t nat -F

        # السياسة الافتراضية للمرور عبر الجدار الناري
        - iptables -P FORWARD DROP

        # السماح بالردود التابعة لاتصالات قائمة
        - iptables -A FORWARD -i eth0 -o eth1 -d 10.0.0.0/8 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT

        # السماح بـ DNS UDP
        - iptables -A FORWARD -i eth1 -o eth0 -s 10.0.0.0/8 -p udp --dport 53 -m conntrack --ctstate NEW,ESTABLISHED -j ACCEPT

        # السماح بـ DNS TCP
        - iptables -A FORWARD -i eth1 -o eth0 -s 10.0.0.0/8 -p tcp --dport 53 -m conntrack --ctstate NEW,ESTABLISHED -j ACCEPT

        # السماح بـ HTTP
        - iptables -A FORWARD -i eth1 -o eth0 -s 10.0.0.0/8 -p tcp --dport 80 -m conntrack --ctstate NEW,ESTABLISHED -j ACCEPT

        # السماح بـ HTTPS
        - iptables -A FORWARD -i eth1 -o eth0 -s 10.0.0.0/8 -p tcp --dport 443 -m conntrack --ctstate NEW,ESTABLISHED -j ACCEPT

        # السماح بالـ Ping
        - iptables -A FORWARD -i eth1 -o eth0 -s 10.0.0.0/8 -p icmp --icmp-type echo-request -j ACCEPT

        # تسجيل أي ترافيك ممنوع
        - iptables -A FORWARD -m limit --limit 5/min --limit-burst 10 -j LOG --log-prefix "FW-DROP " --log-level 4

        # NAT أصبح على الـFirewall بدل ISP
        - iptables -t nat -A POSTROUTING -s 10.0.0.0/8 -o eth0 -j MASQUERADE

  links:
    - endpoints: ["client1:eth1", "router1:eth1"]
    - endpoints: ["router1:eth2", "router2:eth1"]
    - endpoints: ["router2:eth2", "client2:eth1"]
    - endpoints: ["router1:eth3", "isp:eth1"]
    - endpoints: ["isp:eth2", "firewall:eth1"]
